[pytest]
# AUD-22704：src 侧测试目录（安全红线/契约测试）此前不被默认收集，
# 实际从未进 CI——全部纳入 testpaths。
testpaths =
    tests
    src/features/ai_harness/tests
    src/features/ai_workflow/tests
    src/features/edit/ai_editing/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# Q01（第六轮审计）：单用例超时触发 faulthandler 全线程栈输出——
# 全量单进程卡死（FFmpegSource.__del__→container.close 与 worker 竞争）
# 时提供可定位诊断而不是无限挂起。栈输出到 stderr，测试继续。
faulthandler_timeout = 300
filterwarnings =
    ignore::DeprecationWarning:PyQt6
markers =
    soak: W08 wall-clock stress soaks (playback/interaction/restart); run explicitly with -m soak, never in normal gates
    webengine: tests that exercise the optional Qt WebEngine preview bridge
    html_renderer: tests that need the pinned external headless browser (Playwright/Chromium) — run as a separate CI job; skip-with-reason when chromium is absent
    gpu_renderer: tests that require a standalone ModernGL context; run on a GPU-capable job and skip with reason otherwise
    slow: marks tests as slow (deselect with '-m "not slow"')
    regression: regression tests
    critical: critical tests
    integration: integration tests
    smoke: smoke tests
    benchmark: deterministic benchmark simulations
    acceptance: video performance acceptance tests (P5-3)
    app: application/controller integration tests
    modular: modularization boundary and smoke tests
    color_core: color pipeline safe regression tests
    composite: composite node graph / evaluator tests
    edit_core: tests for the edit feature (requires edit module)
    edit_ui: edit feature UI tests (PyQt widgets/dialogs)
    real_media: tests that probe the checked-in real video matrix
    composite_core: composite graph and pure node tests
    deliver_core: tests for the deliver feature (requires deliver module)
    media_core: media/video pure unit tests
    visual: visual or PyQt screenshot tests
    unstable: known unstable tests
    color_product: tests that should run in color-only product mode
    studio_product: tests that should run in studio product mode
    edit_product: tests that should run in edit product mode
    composite_product: tests that should run in composite product mode
    physical_missing: tests that verify modules can be physically removed
    ai_edit: AI assistant / TAEP edit-planning focused tests (M0 baseline)
    ai_analysis: media analysis evidence / provider tests (M2/M3)
    generation: generative media (video/music/voice/image) tests (M11)
    mcp: MCP server / toposctl / external client tests (M10)
    privacy: privacy / redaction / data-policy acceptance tests (M0 baseline)
    real_provider: opt-in tests that call an isolated external model/provider
    shared_core: shared-layer pure logic tests (no Qt/GPU; loader/ABI/archive contracts)
