<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="2000" viewBox="0 0 1600 2000">
  <title>TOPOS 优势 04：SDK 与集成</title>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#03111d" stop-opacity=".36"/><stop offset=".52" stop-color="#04101d" stop-opacity=".91"/><stop offset="1" stop-color="#020811" stop-opacity=".98"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#40d9ff"/><stop offset="1" stop-color="#7ef0d1"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#ffb44a"/><stop offset="1" stop-color="#ff6d8a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".46"/></filter>
    <style>
      .cn{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:"SFMono-Regular","Cascadia Code",monospace}.white{fill:#f2f7fb}.muted{fill:#a9bdcb}.cyan{fill:#7fe6ff}.amber{fill:#ffc56a}.card{fill:#071725;fill-opacity:.91;stroke:#2b5870;stroke-width:2}.body{font-size:29px}.small{font-size:24px}
    </style>
  </defs>
  <image x="0" y="0" width="1600" height="2000" preserveAspectRatio="xMidYMid slice" xlink:href="assets/topos_codec_poster_bg.png"/>
  <rect width="1600" height="2000" fill="url(#shade)"/>
  <g class="cn">
    <text x="82" y="118" class="amber" font-size="24" font-weight="800" letter-spacing="5">TOPOS CODEC / ADVANTAGE 04</text>
    <text x="82" y="220" class="white" font-size="70" font-weight="800">SDK 优势：让其他开发者更容易使用</text>
    <text x="86" y="280" class="muted" font-size="29">把能力协商、错误语义、I/O、打包和示例都准备好，再交给宿主应用。</text>
    <rect x="82" y="325" width="440" height="7" rx="3" fill="url(#amber)"/>
  </g>

  <g filter="url(#shadow)" class="cn">
    <rect x="70" y="420" width="700" height="330" rx="26" class="card"/>
    <rect x="70" y="420" width="11" height="330" rx="5" fill="url(#cyan)"/>
    <text x="112" y="482" class="cyan" font-size="24" font-weight="800" letter-spacing="4">PUBLIC C ABI</text>
    <text x="112" y="540" class="white" font-size="43" font-weight="800">先协商，再编码</text>
    <text x="112" y="595" class="white body">ABI version · capability query</text>
    <text x="112" y="643" class="white body">status code · thread-local error</text>
    <text x="112" y="700" class="muted small">调用方可以在加载文件前判断 profile、像素域、位深和 alpha。</text>

    <rect x="830" y="420" width="700" height="330" rx="26" class="card"/>
    <rect x="830" y="420" width="11" height="330" rx="5" fill="url(#amber)"/>
    <text x="872" y="482" class="amber" font-size="24" font-weight="800" letter-spacing="4">HOST CONTROLLED I/O</text>
    <text x="872" y="540" class="white" font-size="43" font-weight="800">I/O 由宿主掌控</text>
    <text x="872" y="595" class="white body">read / write / seek callbacks</text>
    <text x="872" y="643" class="white body">文件、内存、网络都能接入</text>
    <text x="872" y="700" class="muted small">库不强行接管文件系统，适合编辑器、服务端和缓存系统。</text>

    <rect x="70" y="800" width="700" height="330" rx="26" class="card"/>
    <rect x="70" y="800" width="11" height="330" rx="5" fill="url(#amber)"/>
    <text x="112" y="862" class="amber" font-size="24" font-weight="800" letter-spacing="4">TOOLS &amp; PACKAGES</text>
    <text x="112" y="920" class="white" font-size="43" font-weight="800">拿来就能集成</text>
    <text x="112" y="975" class="white body">CMake package · C/C++ smoke test</text>
    <text x="112" y="1023" class="white body">topos CLI · toos CLI · Python 示例</text>
    <text x="112" y="1080" class="muted small">头文件、库、NOTICE、文档和回归测试一起交付。</text>

    <rect x="830" y="800" width="700" height="330" rx="26" class="card"/>
    <rect x="830" y="800" width="11" height="330" rx="5" fill="url(#cyan)"/>
    <text x="872" y="862" class="cyan" font-size="24" font-weight="800" letter-spacing="4">ONE SOURCE OF TRUTH</text>
    <text x="872" y="920" class="white" font-size="43" font-weight="800">能力清单防止漂移</text>
    <text x="872" y="975" class="white body">capability_manifest.json</text>
    <text x="872" y="1023" class="white body">spec / native / Python / UI 对齐</text>
    <text x="872" y="1080" class="muted small">新增档位先改真相源，再由测试钉住实现和文档。</text>
  </g>

  <g class="cn">
    <text x="82" y="1250" class="white" font-size="31" font-weight="800" letter-spacing="3">从一次调用到完整产品</text>
    <line x1="82" y1="1285" x2="1518" y2="1285" stroke="#2d657f" stroke-width="2"/>
    <g transform="translate(100 1390)"><circle r="35" fill="#0b2c3c" stroke="#3eb9d4"/><text x="0" y="10" text-anchor="middle" class="cyan" font-size="30" font-weight="800">1</text><text x="0" y="78" text-anchor="middle" class="white body" font-weight="700">query</text></g>
    <line x1="145" y1="1390" x2="430" y2="1390" stroke="#3eb9d4" stroke-width="4"/>
    <g transform="translate(465 1390)"><circle r="35" fill="#1e1c1a" stroke="#a06e3c"/><text x="0" y="10" text-anchor="middle" class="amber" font-size="30" font-weight="800">2</text><text x="0" y="78" text-anchor="middle" class="white body" font-weight="700">encode</text></g>
    <line x1="510" y1="1390" x2="795" y2="1390" stroke="#ffb44a" stroke-width="4"/>
    <g transform="translate(830 1390)"><circle r="35" fill="#201b2d" stroke="#725a9b"/><text x="0" y="10" text-anchor="middle" fill="#d6b8ff" font-size="30" font-weight="800">3</text><text x="0" y="78" text-anchor="middle" class="white body" font-weight="700">verify</text></g>
    <line x1="875" y1="1390" x2="1160" y2="1390" stroke="#b990e6" stroke-width="4"/>
    <g transform="translate(1195 1390)"><circle r="35" fill="#0b2c3c" stroke="#3eb9d4"/><text x="0" y="10" text-anchor="middle" class="cyan" font-size="30" font-weight="800">4</text><text x="0" y="78" text-anchor="middle" class="white body" font-weight="700">ship</text></g>
    <text x="83" y="1580" class="muted small">宿主应用只需要负责自己的媒体生命周期；TOPOS 负责格式、编码、解码、校验和诊断。</text>

    <rect x="82" y="1660" width="1436" height="165" rx="22" fill="#071725" fill-opacity=".84" stroke="#2b5870"/>
    <text x="120" y="1722" class="amber" font-size="28" font-weight="800">平台与生态路线</text>
    <text x="120" y="1770" class="white body" font-weight="700">macOS / Linux 原生路径 · Windows SDK 计划已就绪，等待实机验收</text>
    <text x="120" y="1810" class="muted small">未来适配：Topos Color · Topos Edit · Topos Composite · DaVinci Resolve · Adobe Premiere Pro</text>
    <text x="82" y="1935" class="muted" font-size="20">TOPOS Codec V1 Preview · SDK 能力以公开文档、示例和测试门禁为准 · 04 / 05</text>
  </g>
</svg>
