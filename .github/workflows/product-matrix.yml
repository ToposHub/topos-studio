# Topos Product Matrix CI
#
# This workflow builds and verifies all four product variants.
# It is provided as a template - adjust triggers, Python versions,
# and platform targets to match your CI environment.
#
# Products:
#   topos-studio    - Full product (all features)
#   topos-color     - Color grading focused
#   topos-edit      - Editing focused
#   topos-composite - Compositing focused

name: Product Matrix Build & Verify

on:
  # Uncomment to enable automatic triggers:
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:  # Manual trigger only (template mode)

permissions:
  contents: read

jobs:
  build-product:
    name: Build ${{ matrix.product }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product:
          - topos-studio
          - topos-color
          - topos-edit
          - topos-composite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Validate product config (dry-run)
        run: |
          bash scripts/build_product.sh ${{ matrix.product }} --dry-run

      - name: Build product bundle
        run: |
          bash scripts/build_product.sh ${{ matrix.product }}

      - name: Verify product bundle
        run: |
          python scripts/verify_product_bundle.py \
            ${{ matrix.product }} \
            dist/${{ matrix.product }}/${{ matrix.product }} \
            --verbose

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}-bundle
          path: dist/${{ matrix.product }}/
          retention-days: 7

  verify-source-configs:
    name: Verify source configs
    runs-on: ubuntu-latest
    needs: []  # Runs in parallel with build-product

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify all product configs
        run: |
          for product in topos-studio topos-color topos-edit topos-composite; do
            echo "--- Verifying $product ---"
            python scripts/verify_product_bundle.py "$product" --source --verbose
            echo ""
          done

      - name: Run packaging tests
        run: |
          python -m pytest tests/ -k "packaging or product" -v

  physical-missing-features:
    name: Physical missing features (${{ matrix.product-mode }})
    runs-on: ubuntu-latest
    needs: []  # Runs in parallel

    strategy:
      fail-fast: false
      matrix:
        product-mode:
          - color
          - edit
          - composite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Install Qt dependencies for headless testing
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-xinerama0 libxcb-cursor0

      - name: Run physical missing features test
        run: |
          bash scripts/check_physical_missing_features.sh --product ${{ matrix.product-mode }}

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [build-product, verify-source-configs, physical-missing-features]

    steps:
      - name: Check results
        run: |
          echo "Build Product:        ${{ needs.build-product.result }}"
          echo "Verify Source Configs: ${{ needs.verify-source-configs.result }}"
          echo "Physical Missing:     ${{ needs.physical-missing-features.result }}"
          if [ "${{ needs.build-product.result }}" = "failure" ] || \
             [ "${{ needs.verify-source-configs.result }}" = "failure" ] || \
             [ "${{ needs.physical-missing-features.result }}" = "failure" ]; then
            echo "One or more jobs failed!"
            exit 1
          fi
          echo "All jobs passed!"
